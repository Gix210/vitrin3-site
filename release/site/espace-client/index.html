<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Votre livraison · VITRIN3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f6;color:#101820;font:16px Arial,sans-serif}header{padding:26px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #cbd7dd}header strong{letter-spacing:-1px;font-size:24px}header span{font-size:13px}main{max-width:1200px;margin:auto;padding:60px 24px}h1{font-size:clamp(32px,5vw,62px);letter-spacing:-.04em;font-weight:500;line-height:1.1}h2{font-size:26px;font-weight:500}p{line-height:1.6}.gate{max-width:470px;margin:5vh auto}.gate p{color:#526571}input{width:100%;padding:16px;border:1px solid #9bafb9;background:white;border-radius:6px;font:inherit;margin:12px 0}button,.download{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:13px 22px;border:0;border-radius:30px;background:#39bffe;color:#101820;font-size:15px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}.error{color:#96271d}.meta{font-size:14px;color:#526571}.note{white-space:pre-wrap;padding:28px;background:white;border-left:4px solid #39bffe;margin:30px 0}.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.file{background:white;border-radius:12px;overflow:hidden}.visual{height:320px;background:#e3eaee;display:flex;align-items:center;justify-content:center}.visual img,.visual video{max-width:100%;max-height:100%;object-fit:contain}.file-body{padding:24px}.file h3{overflow-wrap:anywhere;font-size:18px;font-weight:500}.doc{font-size:60px;color:#476674}.footer{margin-top:50px;padding-top:24px;border-top:1px solid #cbd7dd;font-size:14px}.toolbar{display:flex;gap:18px;align-items:center;justify-content:space-between}.lock{background:#e1e9ed}[hidden]{display:none!important}:focus-visible{outline:3px solid #146898;outline-offset:4px}@media(max-width:650px){.files{grid-template-columns:1fr}.visual{height:300px}.toolbar{align-items:start;flex-direction:column}main{padding-top:32px}}
</style><link rel="stylesheet" href="/assets/tidio.css"></head><body><header><strong>VITRIN3<span style="color:#159dde"> ▪</span></strong><span>ESPACE CLIENT</span></header><main><form class="gate" id="unlock"><h1>Votre livraison.</h1><p>Sélectionnez le fichier de livraison reçu de VITRIN3, puis entrez votre mot de passe.</p><label for="package">Fichier de livraison</label><input id="package" type="file" accept=".html" required><label for="password">Mot de passe</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">Accéder au projet →</button><p id="error" class="error" role="status"></p><p class="meta">Vos fichiers se déverrouillent dans ce navigateur. Aucun compte à créer.</p></form><section id="project" hidden></section></main><script>
'use strict';let encrypted=null;const urls=[];
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function text(tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el;}
function lock(){urls.forEach(URL.revokeObjectURL);urls.length=0;document.querySelector('#project').replaceChildren();document.querySelector('#project').hidden=true;document.querySelector('#unlock').hidden=false;document.querySelector('#password').value='';}
document.querySelector('#unlock').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;document.querySelector('#error').textContent='';try{
 if(!crypto.subtle)throw Error('unsupported');const file=document.querySelector('#package').files[0];if(!file||file.size>160*1024*1024)throw Error('invalid');const raw=await file.text();const start=raw.indexOf('const encrypted=');const end=raw.indexOf(';const urls=[];',start);if(start<0||end<0)throw Error('invalid');encrypted=JSON.parse(raw.slice(start+16,end));
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#password').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encrypted.salt),iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encrypted.iv)},key,bytes(encrypted.data));const project=JSON.parse(new TextDecoder().decode(clear));const container=document.querySelector('#project');container.replaceChildren();
 const bar=text('div','','toolbar');bar.append(text('p',project.client,'meta'));const close=text('button','Verrouiller','lock');close.type='button';close.onclick=lock;bar.append(close);container.append(bar,text('h1',project.title),text('p','Livraison du '+new Date(project.date).toLocaleDateString('fr-CA')+' · '+project.files.length+' fichier(s)','meta'));
 if(project.instructions)container.append(text('div',project.instructions,'note'));container.append(text('h2','Fichiers'));const grid=text('div','','files');
 for(const file of project.files){const blob=new Blob([bytes(file.data)],{type:file.type}),url=URL.createObjectURL(blob);urls.push(url);const card=text('article','','file'),visual=text('div','','visual');if(file.type.startsWith('image/')){const img=new Image();img.src=url;img.alt=file.name;visual.append(img);}else if(file.type==='video/mp4'){const video=document.createElement('video');video.src=url;video.controls=true;video.preload='metadata';video.playsInline=true;visual.append(video);}else visual.append(text('span','PDF','doc'));const body=text('div','','file-body');body.append(text('h3',file.name),text('p',(file.size/1024/1024).toFixed(2)+' Mo','meta'));const download=text('a','Télécharger ↓','download');download.href=url;download.download=file.name;body.append(download);card.append(visual,body);grid.append(card);}container.append(grid);
 const footer=text('div','','footer');footer.append(text('p','Une question sur les fichiers ou leur utilisation ?'));const email=text('a','vitrin3inc@gmail.com');email.href='mailto:vitrin3inc@gmail.com?subject='+encodeURIComponent(project.title);footer.append(email);container.append(footer);event.target.hidden=true;container.hidden=false;document.querySelector('#password').value='';
 }catch(error){document.querySelector('#error').textContent=error.message==='unsupported'?'Ouvrez ce fichier dans un navigateur récent, ou via une adresse HTTPS.':'Mot de passe incorrect ou fichier endommagé.';}finally{button.disabled=false;}});
</script><script src="/assets/tidio.js" defer></script></body></html>
